[project]
name = "my-project"
version = "0.1.0"
description = "My Python project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py314"
line-length = 120
fix = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --tb=short"
markers = [
    "unit: isolated unit tests with mocked dependencies",
    "integration: tests involving multiple components or external systems",
    "manual: tests requiring manual setup — skipped by default",
]
