# Install no package version younger than 7 days (minutes; needs pnpm 10.16 or later)
minimumReleaseAge: 10080
# minimumReleaseAgeExclude: [<package>]  # only for a security fix, with the reason
# Dependencies that may run their install script; pnpm 11 and later fail the install on any other
allowBuilds:
  esbuild: true # the binary of tsx and Vite
