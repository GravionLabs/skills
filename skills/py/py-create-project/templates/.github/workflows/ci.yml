name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    uses: GravionLabs/ci/.github/workflows/python-package.yml@v1
    permissions:
      contents: write
      checks: write
      pull-requests: write
      id-token: write
      issues: write
    with:
      python-version: '3.14'
    secrets:
      publish-api-key: ${{ secrets.PYPI_TOKEN }}
