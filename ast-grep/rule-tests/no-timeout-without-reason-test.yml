id: no-timeout-without-reason
valid:
  - it('works', () => {})
  - |
    // timeout: the container start takes 20 s
    it('works', () => {}, { timeout: 30000 })
  - |
    // timeout: slow integration suite
    vi.setConfig({ testTimeout: 30000 })
invalid:
  - "it('works', () => {}, { timeout: 30000 })"
  - 'vi.setConfig({ testTimeout: 30000 })'
  - |
    // slow
    it('works', () => {}, { timeout: 30000 })
