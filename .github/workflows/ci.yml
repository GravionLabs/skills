name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
    # The types of the pr-checks job (body, label and draft changes rerun the readiness check). Every job runs for every
    # type: a skipped code check would let "PR checks passed" of such an event go green before the tests of the head finish.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]
  workflow_dispatch:

permissions:
  checks: write
  pull-requests: write
  contents: read

# Required check of the rulesets on main and release: "PR checks passed" (the last job, needs every other job).
# Add, rename or remove a job here without a ruleset change; list it in `needs` of "PR checks passed".
# Nothing is generated into the repository: site/skill-list.md is built in the working tree for the site only.
jobs:
  # Readiness, title, adr and spec checks of the reusable workflow pr-checks.yml of GravionLabs/ci, all inputs at their defaults.
  # - readiness (#71): the PR body closes an issue (Closes|Fixes|Resolves #n, require-issue: true) and each closed issue is
  #   ready (no needs-decision or needs-refinement label, no open "blocked by" issue). Release PRs from release/** are exempt.
  # - title (#102): the PR title is a Conventional Commit and agrees with the commits (feat commit -> feat title, breaking
  #   commit -> "!"), because the squash merge into release/next takes the PR title and the version bump reads it.
  # - adr and spec: skipped green, the repository has no governance key in .agents/config.json.
  # No secrets, no checkout: it reads the PR and the issues through the API with the GITHUB_TOKEN. The job grants the union of
  # what the jobs of pr-checks.yml request (readiness, adr, spec, title, retarget): GitHub validates the permissions of every
  # called job at startup, skipped ones included, so less ends in startup_failure.
  pr-checks:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
      pull-requests: write # the retarget job of ci pr-checks since v1.14.0 (ci#232)
    uses: GravionLabs/ci/.github/workflows/pr-checks.yml@v1

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # Local equivalent: pnpm run check; keep CI checks separate for individual job logs.
    permissions:
      contents: read
    env:
      PUPPETEER_SKIP_DOWNLOAD: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # node/setup has no node-version-file input: the version comes from .nvmrc
      - name: Read the Node version
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Node and pnpm
        uses: GravionLabs/ci/node/setup@v1
        with:
          node-version: ${{ steps.node.outputs.version }}
          package-manager: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check marketplace groups
        run: node scripts/check-marketplace.mjs

      - name: Skill report (sizes, dangling references)
        shell: pwsh
        run: ./skills/skill-tooling/skill-slim/scripts/Get-SkillReport.ps1 -Root . -FailOnDangling

      - name: Check formatting
        run: pnpm run format:check

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force

      - name: Analyze PowerShell scripts
        run: pnpm run lint:ps

      # site/skill-list.md is gitignored; generate it in the working tree only so the site build resolves its links.
      - name: Generate docs for site build
        run: pnpm run generate

      - name: Test docs site
        run: pnpm --filter site test

      - name: Build docs site
        run: pnpm --filter site build

  # One Vitest project, four shards in parallel. The aggregate job "Test" keeps the ruleset's required check name.
  # GravionLabs/ci/node/test@v1 is not used: its artifact and check names are fixed.
  test-shard:
    name: Test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PUPPETEER_SKIP_DOWNLOAD: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # node/setup has no node-version-file input: the version comes from .nvmrc
      - name: Read the Node version
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Node and pnpm
        uses: GravionLabs/ci/node/setup@v1
        with:
          node-version: ${{ steps.node.outputs.version }}
          package-manager: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        env:
          VITEST_JUNIT_OUTPUT: test-results/junit-${{ matrix.shard }}.xml
          # the vendored agent-events copy must equal its pinned tag (test/skills/delivery/agent-events.test.ts)
          AGENT_EVENTS_VERIFY: '1'
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/4

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore

  # The loop of deliver runs on Windows too (#689): its tests on windows-latest. Part of "PR checks passed" like every job.
  test-windows:
    name: Test deliver (windows)
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      PUPPETEER_SKIP_DOWNLOAD: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read the Node version
        id: node
        shell: bash
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Node and pnpm
        uses: GravionLabs/ci/node/setup@v1
        with:
          node-version: ${{ steps.node.outputs.version }}
          package-manager: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm exec vitest run test/skills/delivery/deliver.test.ts

  # Aggregate job "Test": green only when all four shards succeeded (a skipped shard is not green).
  # The github-actions reporter annotates failures.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: test-shard
    if: always()
    permissions:
      contents: read
    steps:
      - name: Require all shards to succeed
        env:
          RESULT: ${{ needs.test-shard.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "Test shards finished with result: $RESULT (all four shards must succeed)"
            exit 1
          fi

  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    outputs:
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # Conventional Commit bump (input conventional-commits, default true since GravionLabs/ci v1.4.0, ci#107)
      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@v1
        with:
          gitversion-config-file: GitVersion.yml

  # A release is a git tag: `npx skills add GravionLabs/skills#v<x.y.z>` pins it. No manifest carries a version.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - determine-version
      - build-test
      - test
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Checkout # zizmor: ignore[artipacked] the gh-release step below pushes the changelog commit and recreates release/next with these credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Create GitHub Release
        uses: GravionLabs/ci/versioning/gh-release@v1
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          version: ${{ needs.determine-version.outputs.semver }}
          changelog-file: CHANGELOG.md
          cliff-config: cliff.toml
          update-changelog: 'true'
          # Merging the release PR deletes release/next (delete_branch_on_merge); recreated here at the released commit.
          recreate-branch: release/next

  # The one required check of the rulesets on main and release. Green when no needed job failed or was cancelled;
  # skipped is accepted only for jobs that never run for the event (determine-version, release outside main, pr-checks outside a PR). `if: always()` runs it after a failure too.
  pr-checks-passed:
    name: PR checks passed
    runs-on: ubuntu-latest
    if: always()
    needs:
      - pr-checks
      - build-test
      - test-shard
      - test-windows
      - test
      - determine-version
      - release
    permissions: {}
    steps:
      - name: Require every job to succeed or be skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null; then
            echo "A needed job failed or was cancelled"
            exit 1
          fi
