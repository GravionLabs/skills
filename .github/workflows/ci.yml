name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, release/next]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  checks: write
  pull-requests: write
  contents: read

# Required checks of the ruleset on release/next: "Build & Test" and "Test".
# Nothing is generated into the repository: site/skill-list.md is built in the working tree for the site only.
jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # Local equivalent: pnpm run check; keep CI checks separate for individual job logs.
    permissions:
      contents: read
    env:
      PUPPETEER_SKIP_DOWNLOAD: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # node/setup has no node-version-file input: the version comes from .nvmrc
      - name: Read the Node version
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Node and pnpm
        uses: GravionLabs/ci/node/setup@v1
        with:
          node-version: ${{ steps.node.outputs.version }}
          package-manager: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check marketplace groups
        run: node scripts/check-marketplace.mjs

      - name: Skill report (sizes, dangling references)
        shell: pwsh
        run: ./skills/skill-tooling/skill-slim/scripts/Get-SkillReport.ps1 -Root . -FailOnDangling

      - name: Check formatting
        run: pnpm run format:check

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force

      - name: Analyze PowerShell scripts
        run: pnpm run lint:ps

      # site/skill-list.md is gitignored; generate it in the working tree only so the site build resolves its links.
      - name: Generate docs for site build
        run: pnpm run generate

      - name: Test docs site
        run: pnpm --filter site test

      - name: Build docs site
        run: pnpm --filter site build

  # One Vitest project, two shards in parallel. The aggregate job "Test" keeps the ruleset's required check name.
  # GravionLabs/ci/node/test@v1 is not used: its artifact and check names are fixed.
  test-shard:
    name: Test (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      PUPPETEER_SKIP_DOWNLOAD: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # node/setup has no node-version-file input: the version comes from .nvmrc
      - name: Read the Node version
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Node and pnpm
        uses: GravionLabs/ci/node/setup@v1
        with:
          node-version: ${{ steps.node.outputs.version }}
          package-manager: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        env:
          VITEST_JUNIT_OUTPUT: test-results/junit-${{ matrix.shard }}.xml
          # the vendored agent-events copy must equal its pinned tag (test/skills/delivery/agent-events.test.ts)
          AGENT_EVENTS_VERIFY: '1'
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/2

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore

  # Aggregate check "Test": green only when both shards succeeded. The github-actions reporter annotates failures.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: test-shard
    if: always()
    permissions:
      contents: read
    steps:
      - name: Require both shards to succeed
        env:
          RESULT: ${{ needs.test-shard.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "Test shards finished with result: $RESULT (both shards must succeed)"
            exit 1
          fi

  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    outputs:
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Conventional Commit bump (input conventional-commits, default true since GravionLabs/ci v1.4.0, ci#107)
      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@v1
        with:
          gitversion-config-file: GitVersion.yml

  # A release is a git tag: `npx skills add GravionLabs/skills#v<x.y.z>` pins it. No manifest carries a version.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - determine-version
      - build-test
      - test
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Create GitHub Release
        uses: GravionLabs/ci/versioning/gh-release@v1
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          version: ${{ needs.determine-version.outputs.semver }}
          changelog-file: CHANGELOG.md
          cliff-config: cliff.toml
          update-changelog: 'true'
          # Merging the release PR deletes release/next (delete_branch_on_merge); recreated here at the released commit.
          recreate-branch: release/next
