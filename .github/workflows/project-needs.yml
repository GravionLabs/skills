# Hourly full sync of the project field Needs, handled by the reusable workflow issues.yml of GravionLabs/ci
# (mode full). Event syncs (labels, closes, pull requests) run from issue-events.yml; this schedule heals anything skipped.
# PROJECT_TOKEN (optional, classic PAT with scope `project`) wins; it falls back to GH_PAT. No token: a warning and a green job.
name: Project needs

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  needs:
    # GitHub validates every job of issues.yml at startup; its conventions job requests issues: write.
    permissions:
      issues: write
    uses: GravionLabs/ci/.github/workflows/issues.yml@main
    with:
      project-url: https://github.com/users/GravionLabs/projects/17
      needs: true
      mode: full
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
