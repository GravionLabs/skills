name: Pages

# The documentation site (site/, VitePress) on GitHub Pages, built and deployed by the reusable workflow of
# GravionLabs/ci. Pull requests that touch the site build it as a dry run (tests, dead links); a push to main
# deploys (Settings -> Pages -> Source must be "GitHub Actions"). To build without publishing set `deploy: false`.
# The generated skill list (site/skill-list.md, gitignored) is built by the pre-build step and never committed.
# Pull requests also build when skills/, the marketplace or the generator change, because the list derives from them.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'site/**'
      - 'README.md'
      - 'skills/**'
      - '.claude-plugin/**'
      - 'scripts/generate-skill-list.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

jobs:
  pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: GravionLabs/ci/.github/workflows/vitepress-pages.yml@v1
    with:
      site-path: site
      package-manager: pnpm
      pre-build: pnpm run generate
      deploy: true
