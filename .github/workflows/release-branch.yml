# Pushes to a release branch, handled by the reusable workflow release-branch.yml of GravionLabs/ci: keeps the release PR
# open and current, closes the merged issues and syncs the project field Needs.
# CI_APP_ID and CI_APP_PRIVATE_KEY (required) are the id and private key of the GitHub App gravionlabs-ci; a PR created
# with the GITHUB_TOKEN triggers no pull_request workflows. GH_PAT is no longer read by v1.
# PROJECT_TOKEN (optional, classic PAT with scope `project`) is used for the project calls.
name: Release branch

on:
  push:
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only list the issues that would be closed
        type: boolean
        default: true

permissions: {}

jobs:
  release-branch:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: GravionLabs/ci/.github/workflows/release-branch.yml@v1
    with:
      project-url: https://github.com/users/GravionLabs/projects/17
      dry-run: ${{ inputs.dry-run == true }}
    secrets:
      CI_APP_ID: ${{ secrets.CI_APP_ID }}
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
